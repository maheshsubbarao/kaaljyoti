name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK 27
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/cmdline-tools/
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          ls $ANDROID_HOME/ndk/
          ls $ANDROID_HOME/ndk/27.0.12077973/ | head -n 20
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Patch sweph and local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> android/local.properties
          echo "flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.32.0-x64" >> android/local.properties
          cat android/local.properties
          SWEPH=$(find $HOME -path "*sweph/android/build.gradle" 2>/dev/null | head -n 1)
          if [ -z "$SWEPH" ]; then SWEPH=$(find /opt -path "*sweph/android/build.gradle" 2>/dev/null | head -n 1); fi
          echo "SWEPH: $SWEPH"
          cat "$SWEPH"
          # Inject ndkVersion if missing
          if! grep -q "ndkVersion" "$SWEPH"; then
            sed -i '/android {/a \ ndkVersion "27.0.12077973"' "$SWEPH"
          fi
          cat "$SWEPH"

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk