name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK 26
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'

      - run: flutter pub get

      - name: Fix NDK + sweph off_t64 error
        run: |
          NDK_VER=26.1.10909125
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/$NDK_VER" >> android/local.properties
          echo "android.ndk.suppressMinSdkVersionError=21" >> android/gradle.properties

          echo "=== Searching for ALL build.gradle with 28.7 ==="
          find $HOME -type f -name "build.gradle" 2>/dev/null | xargs grep -l "28.7.33676358" 2>/dev/null || echo "No 28.7 file found in first search"
          find $HOME -type f -name "build.gradle" 2>/dev/null -exec grep -l "28.7" {} \; 2>/dev/null

          echo "=== Patching EVERY build.gradle in HOME ==="
          find $HOME -type f -name "build.gradle" 2>/dev/null | while read f; do
            if grep -q "28.7.33676358" "$f" 2>/dev/null; then
              echo "PATCHING $f"
              sed -i "s/28.7.33676358/$NDK_VER/g" "$f"
            fi
            if grep -q "ndkVersion" "$f" 2>/dev/null; then
              # Force any ndkVersion to 26
              sed -i "s/ndkVersion = \".*\"/ndkVersion = \"$NDK_VER\"/g" "$f"
              sed -i "s/ndkVersion \".*\"/ndkVersion \"$NDK_VER\"/g" "$f"
            fi
          done

          echo "=== Also patching pub-cache git folder specifically ==="
          find $HOME/.pub-cache -type f -name "*.gradle" 2>/dev/null | xargs sed -i "s/28.7.33676358/$NDK_VER/g" 2>/dev/null || true
          find $HOME -path "*sweph*" -name "*.gradle" 2>/dev/null | xargs sed -i "s/28.7.33676358/$NDK_VER/g" 2>/dev/null || true

          echo "=== Patching C files ==="
          find $HOME -path "*sweph*/native/sweph/src/*.c" 2>/dev/null | while read src; do
            echo "Patching $src"
            sed -i "s/off_t64/off64_t/g" "$src"
          done

          echo "=== Verify fix ==="
          find $HOME -type f -name "build.gradle" 2>/dev/null | xargs grep -n "28.7" 2>/dev/null || echo "SUCCESS: No 28.7 left anywhere"
          find $HOME/.pub-cache -name "build.gradle" -path "*sweph*" -exec grep -H "ndkVersion" {} \; 2>/dev/null

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk