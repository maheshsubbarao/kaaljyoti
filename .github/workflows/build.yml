name: Build Kaal Jyoti APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Setup Flutter Latest
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          
      - name: Recreate Android
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name kaaljyoti
          
      - name: FIX ALL CODE BUGS
        run: |
          find lib -name "*.dart" -exec sed -i 's/onReorderItem/onReorder/g' {} \;
          sed -i 's/ResearchLabModule(),/\/\/ ResearchLabModule() - commented/g' lib/widgetsystem/registry.dart || true

      - name: FIX Desugaring - THE FINAL BOSS
        run: |
          FILE="android/app/build.gradle.kts"
          echo "Patching $FILE"
          # Add desugar dependency if not present
          if ! grep -q "desugar_jdk_libs" "$FILE"; then
            sed -i '/dependencies {/a \    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' "$FILE"
          fi
          # Enable coreLibraryDesugaring
          if ! grep -q "isCoreLibraryDesugaringEnabled" "$FILE"; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' "$FILE"
          fi
          cat "$FILE" | grep -A2 -B2 "desugar\|Desugar" || true
          
      - name: Get packages
        run: flutter pub get
          
      - name: Build APK
        run: flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaal-jyoti-apk
          path: build/app/outputs/flutter-apk/app-release.apk
