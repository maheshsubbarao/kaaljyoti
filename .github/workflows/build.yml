name: Build Kaal Jyoti APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Setup Flutter Latest
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          
      - name: Recreate Android
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name kaaljyoti
          
      - name: FIX ALL CODE BUGS
        run: |
          echo "Fix 1: onReorderItem -> onReorder in ALL files"
          find lib -name "*.dart" -exec sed -i 's/onReorderItem/onReorder/g' {} \;
          
          echo "Fix 2: ResearchLabModule"
          sed -i 's/ResearchLabModule(),/\/\/ ResearchLabModule() - commented for build/g' lib/widgetsystem/registry.dart || true
          
          echo "Check fixed"
          grep -n "onReorder" lib/screens/dashboard_screen.dart | head -5
          grep -n "ResearchLab" lib/widgetsystem/registry.dart | head -5
          
      - name: Get packages
        run: flutter pub get
          
      - name: Build APK
        run: flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaal-jyoti-apk
          path: build/app/outputs/flutter-apk/app-release.apk
