name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK 26 and 28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "ndk;28.1.13356709"
          ls $ANDROID_HOME/ndk/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'

      - run: flutter pub get

      - name: Fix NDK + sweph off_t64 error
        run: |
          # DO NOT set ndk.dir - this was causing CXX1104 error
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

          echo "android.ndk.suppressMinSdkVersionError=21" >> android/gradle.properties

          echo "Patching C files off_t64 -> off64_t"
          find $HOME -path "*sweph*/native/sweph/src/*.c" 2>/dev/null | while read src; do
            echo "Patching $src"
            sed -i "s/off_t64/off64_t/g" "$src"
          done

          echo "Patching sweph minSdk 16->21 to allow build"
          find $HOME -type f -name "build.gradle" -path "*sweph*" 2>/dev/null | while read f; do
            sed -i "s/minSdkVersion 16/minSdkVersion 21/g" "$f"
            sed -i "s/minSdk 16/minSdk 21/g" "$f"
          done

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk