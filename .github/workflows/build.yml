name: Build Kaal Jyoti APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Setup Flutter Latest
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          
      - name: Recreate Android
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name kaaljyoti
          
      - name: FIX ALL DART BUGS
        run: |
          echo "Fixing onReorderItem in ALL files..."
          find lib -type f -name "*.dart" -print -exec sed -i 's/onReorderItem/onReorder/g' {} \;
          echo "Fixing ResearchLabModule..."
          sed -i 's/ResearchLabModule(),/\/\/ ResearchLabModule disabled/g' lib/widgetsystem/registry.dart || true
          echo "VERIFY:"
          grep -rn "onReorderItem" lib/ || echo "No more onReorderItem - GOOD!"
          grep -rn "ResearchLabModule" lib/widgetsystem/registry.dart || echo "ResearchLabModule fixed"
          
      - name: FIX Desugaring for flutter_local_notifications
        run: |
          FILE="android/app/build.gradle.kts"
          sed -i '/dependencies {/a \    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' "$FILE"
          sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' "$FILE"
          echo "Patched $FILE"
          cat "$FILE"
          
      - name: Get packages
        run: flutter pub get
          
      - name: Build APK
        run: flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaal-jyoti-apk
          path: build/app/outputs/flutter-apk/app-release.apk
