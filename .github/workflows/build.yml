name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.1.13356709"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Fix NDK Problem
        run: |
          NDK_VER=28.1.13356709
          # 1. Only sdk.dir, NO ndk.dir - this removes the fight
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          # 2. Find sweph folder directly
          SWEPH_FOLDER=$(ls -d $HOME/.pub-cache/hosted/pub.dev/sweph-* | head -n 1)
          echo "Sweph folder: $SWEPH_FOLDER"
          cat $SWEPH_FOLDER/android/build.gradle
          # 3. Change sweph file to 28.1
          sed -i "s/28.7.33676358/$NDK_VER/g" $SWEPH_FOLDER/android/build.gradle
          sed -i "s/27.0.12077973/$NDK_VER/g" $SWEPH_FOLDER/android/build.gradle
          cat $SWEPH_FOLDER/android/build.gradle
          # 4. Change your app file to 28.1 also
          sed -i "s/27.0.12077973/$NDK_VER/g" android/app/build.gradle.kts || true
          sed -i "s/27.0.12077973/$NDK_VER/g" android/build.gradle.kts || true
          sed -i "s/27.0.12077973/$NDK_VER/g" android/app/build.gradle || true
          sed -i "s/28.7.33676358/$NDK_VER/g" android/app/build.gradle.kts || true

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk