name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK 26
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'

      - run: flutter pub get

      - name: Fix NDK + sweph off_t64 error
        run: |
          NDK_VER=26.1.10909125
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/$NDK_VER" >> android/local.properties

          # Fix 1: Suppress minSdk error
          echo "android.ndk.suppressMinSdkVersionError=21" >> android/gradle.properties
          cat android/gradle.properties

          # Fix 2: Change sweph minSdk 16 -> 21 and NDK 28.7 -> 26.1
          for f in $(find $HOME -name build.gradle 2>/dev/null | xargs grep -l "28.7.33676358" 2>/dev/null); do
            echo "Fixing $f"
            sed -i "s/28.7.33676358/$NDK_VER/g" "$f"
            sed -i "s/minSdkVersion 16/minSdkVersion 21/g" "$f"
            sed -i "s/minSdk 16/minSdk 21/g" "$f"
          done

          # Fix 3: Fix sweph in pub-cache build.gradle
          SWEPH_FILE=$(ls $HOME/.pub-cache/hosted/pub.dev/sweph-*/android/build.gradle 2>/dev/null | head -1)
          if [ -f "$SWEPH_FILE" ]; then
            sed -i "s/28.7.33676358/$NDK_VER/g" $SWEPH_FILE
            sed -i "s/27.0.12077973/$NDK_VER/g" $SWEPH_FILE
            sed -i "s/minSdkVersion 16/minSdkVersion 21/g" $SWEPH_FILE
            cat $SWEPH_FILE | grep -E "ndk|minSdk"
          fi

          # Fix 4: FINAL FIX for off_t64 bug - patch C source
          echo "Patching sweph C files off_t64 -> off64_t"
          for src in $(find $HOME/.pub-cache -path "*sweph*/native/sweph/src/*.c" 2>/dev/null); do
            echo "Patching $src"
            sed -i "s/off_t64/off64_t/g" "$src"
          done
          # Verify fix
          grep -r "off_t64" $HOME/.pub-cache/hosted/pub.dev/sweph-*/native/sweph/src/ || echo "off_t64 removed - FIX OK"

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk