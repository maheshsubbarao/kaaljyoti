name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'

      - name: Install NDK 27
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          ls $ANDROID_HOME/ndk/

      - run: flutter pub get

      - name: FIX NDK version mismatch
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> android/local.properties

          # Fix YOUR project's ndkVersion 26 -> 27
          echo "Fixing android/build.gradle.kts and app/build.gradle.kts"
          sed -i 's/26.1.10909125/27.0.12077973/g' android/build.gradle.kts || true
          sed -i 's/26.1.10909125/27.0.12077973/g' android/app/build.gradle.kts || true
          sed -i 's/26.1.10909125/27.0.12077973/g' android/app/build.gradle || true
          sed -i 's/26.1.10909125/27.0.12077973/g' android/build.gradle || true

          # Also fix any plugin that still forces 26
          find $HOME/.pub-cache -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/26.1.10909125/27.0.12077973/g' 2>/dev/null || true

          # Fix sweph C code
          find $HOME/.pub-cache -name "*.c" -exec sed -i "s/off_t64/off64_t/g" {} \; 2>/dev/null || true
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i "s/minSdkVersion 16/minSdkVersion 21/g" {} \; 2>/dev/null || true

          cat android/app/build.gradle.kts | grep ndkVersion

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk