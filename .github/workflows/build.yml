name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK 27
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Patch sweph and local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> android/local.properties
          cat android/local.properties
          SWEPH_FILE=$(find /home/runner -type f -name "build.gradle" -path "*sweph*" 2>/dev/null | head -n 1)
          echo "SWEPH_FILE=$SWEPH_FILE"
          if [ -f "$SWEPH_FILE" ]; then
            cat "$SWEPH_FILE"
            if! grep -q "ndkVersion" "$SWEPH_FILE"; then
              sed -i '/android {/a \ ndkVersion "27.0.12077973"' "$SWEPH_FILE"
              echo "Patched OK"
            fi
            cat "$SWEPH_FILE"
          else
            echo "Sweph not found, skipping patch - NDK is installed so build should work"
          fi

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk