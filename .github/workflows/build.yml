name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'

      - name: Install NDK 27
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "ndk;26.1.10909125"
          ls $ANDROID_HOME/ndk/
          cat $ANDROID_HOME/ndk/27.0.12077973/source.properties

      - run: flutter pub get

      - name: FIX - Remove ndkVersion + off_t64
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Searching gradle files with ndkVersion..."
          find $HOME -name "build.gradle" 2>/dev/null | xargs grep -l "ndkVersion" | head -20
          find $HOME -name "build.gradle" 2>/dev/null | while read f; do
            if grep -q "ndkVersion" "$f"; then
              echo "Fixing $f"
              sed -i '/ndkVersion/d' "$f"
            fi
          done
          echo "Patch off_t64"
          find $HOME -name "*.c" 2>/dev/null | xargs sed -i "s/off_t64/off64_t/g" 2>/dev/null || true
          echo "Patch minSdk"
          find $HOME -name "build.gradle" 2>/dev/null | xargs sed -i "s/minSdkVersion 16/minSdkVersion 21/g" 2>/dev/null || true

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk