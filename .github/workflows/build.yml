name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK 27
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Force NDK 27 for ALL projects
        run: |
          NDK_VER=27.0.12077973
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/$NDK_VER" >> android/local.properties

          # 1. Show sweph file before
          echo "=== BEFORE ==="
          cat $HOME/.pub-cache/hosted/pub.dev/sweph-*/android/build.gradle | grep ndk

          # 2. Try to fix sweph file with full path
          for f in $(find $HOME -name build.gradle 2>/dev/null | xargs grep -l "28.7.33676358" 2>/dev/null); do
            echo "Fixing $f"
            sed -i "s/28.7.33676358/$NDK_VER/g" "$f"
            sed -i "s/28.1.13356709/$NDK_VER/g" "$f"
          done

          # 3. Show after
          echo "=== AFTER ==="
          cat $HOME/.pub-cache/hosted/pub.dev/sweph-*/android/build.gradle | grep ndk

          # 4. MOST IMPORTANT - Add override to android/build.gradle
          echo "" >> android/build.gradle
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android.ndkVersion = '$NDK_VER' } } }" >> android/build.gradle
          echo "=== android/build.gradle tail ==="
          tail -5 android/build.gradle

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk