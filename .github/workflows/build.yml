name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup NDK 27
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true
          local-cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: PATCH sweph NDK - FINAL FIX
        run: |
          echo "=== Finding sweph build.gradle ==="
          find $HOME -name "build.gradle" | grep sweph
          SWEPH_FILE=$(find $HOME -path "*sweph*/android/build.gradle" | head -n 1)
          echo "Found: $SWEPH_FILE"
          echo "=== BEFORE ==="
          cat "$SWEPH_FILE"
          # Add ndkVersion inside android block
          sed -i "s/android {/android {\n ndkVersion = \"27.0.12077973\"/" "$SWEPH_FILE"
          echo "=== AFTER ==="
          cat "$SWEPH_FILE"
          # Also force SDK NDK folder
          NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}
          echo "NDK_PATH=$NDK_PATH"
          sudo mkdir -p /usr/local/lib/android/sdk/ndk/27.0.12077973
          sudo cp -r $NDK_PATH/* /usr/local/lib/android/sdk/ndk/27.0.12077973/ || true
          ls /usr/local/lib/android/sdk/ndk/

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk