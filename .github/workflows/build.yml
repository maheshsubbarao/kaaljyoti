name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.0.12077973 via sdkmanager
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK installed to:"
          ls -la $ANDROID_HOME/ndk/
          ls -la $ANDROID_HOME/ndk/27.0.12077973/ | head -n 20
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: PATCH sweph - show file
        run: |
          echo "PUB_CACHE locations:"
          find /home -type d -name "sweph*" 2>/dev/null | head -n 20
          find /opt -type d -name "sweph*" 2>/dev/null | head -n 20
          SWEPH=$(find $HOME /opt -path "*sweph/android/build.gradle" 2>/dev/null | head -n 1)
          echo "SWEPH file: $SWEPH"
          cat "$SWEPH"
          # Create local.properties with NDK path
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/local.properties
          # Also force ndkVersion into sweph file
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34\n ndkVersion "27.0.12077973"/' "$SWEPH" || true
          # If above failed, just inject after android {
          grep -q 'ndkVersion' "$SWEPH" || sed -i '/android {/a \ ndkVersion "27.0.12077973"' "$SWEPH"
          echo "--- AFTER PATCH ---"
          cat "$SWEPH"

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk