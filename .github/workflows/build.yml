name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK 26
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'

      - run: flutter pub get

      - name: Fix NDK + sweph off_t64 error
        run: |
          NDK_VER=26.1.10909125
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/$NDK_VER" >> android/local.properties

          echo "android.ndk.suppressMinSdkVersionError=21" >> android/gradle.properties

          # FIX ALL sweph files - this is the new fix for :jni error
          echo "Fixing all sweph gradle files..."
          find $HOME/.pub-cache -type f -name "*.gradle" -path "*sweph*" 2>/dev/null | while read f; do
            echo "Fixing $f"
            sed -i "s/28.7.33676358/$NDK_VER/g" "$f"
            sed -i "s/28.1.13356709/$NDK_VER/g" "$f"
            sed -i "s/27.0.12077973/$NDK_VER/g" "$f"
            sed -i "s/ndkVersion = \".*\"/ndkVersion = \"$NDK_VER\"/g" "$f"
          done

          # Also fix jni folder build.gradle if exists
          find $HOME/.pub-cache -path "*sweph*/jni*" -name "*.gradle" 2>/dev/null -exec sed -i "s/28.7.33676358/$NDK_VER/g" {} \;
          find $HOME/.pub-cache -path "*sweph*/jni*" -name "*.gradle" 2>/dev/null -exec sed -i "s/28.*/$NDK_VER/g" {} \; || true

          # Patch C files off_t64 -> off64_t
          echo "Patching C files..."
          for src in $(find $HOME/.pub-cache -path "*sweph*/native/sweph/src/*.c" 2>/dev/null); do
            sed -i "s/off_t64/off64_t/g" "$src"
          done

          # Verify
          grep -R "28.7.33676358" $HOME/.pub-cache/hosted/pub.dev/sweph-* 2>/dev/null || echo "All 28.7 removed - OK"
          cat $HOME/.pub-cache/hosted/pub.dev/sweph-*/android/build.gradle | grep ndkVersion
          find $HOME/.pub-cache/hosted/pub.dev/sweph-* -name "build.gradle" -exec grep -H "ndkVersion" {} \;

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk