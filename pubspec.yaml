name: kaaljyotif
description: "Kaal Jyoti — Horoscope Calculator. High-precision Vedic astrology & kundali platform, deeply customizable, mobile-native."
publish_to: "none"
version: 0.1.4+23

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^8.1.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sweph:
    git:
      url: https://github.com/vm75/sweph.dart.git
      ref: v4.1.0+2.10.3
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  home_widget: ^0.7.0
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  flutter_timezone: ^3.0.1
  http: ^1.2.1
  intl: any
  timezone: ^0.9.3
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  sentry_flutter: ^8.14.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^9.0.1
  lat_lng_to_timezone: ^0.2.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4
  plugin_platform_interface: ^2.1.8
  geolocator_platform_interface: ^4.2.8
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "branding/generated/icon_source_1024.png"
  adaptive_icon_background: "#F8F3E8"
  adaptive_icon_foreground: "branding/generated/adaptive_foreground_1024.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F8F3E8"
  image: "branding/generated/splash_emblem_1024.png"
  android_12:
    image: "branding/generated/android12_emblem_1024.png"
    color: "#F8F3E8"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - google_fonts/
    - assets/emblem.png
    - assets/kj_devanagari_pdf.ttf
    - assets/
    # - assets/ephe/
